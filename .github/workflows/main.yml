name: Build and Push MERN Docker Images

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure (debug, recruiter-friendly)
        run: |
          echo "Root directory:"
          ls -la
          echo "mern_docker directory:"
          ls -la mern_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- FRONTEND ----------
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./mern_docker/frontend
          file: ./mern_docker/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest

      # ---------- BACKEND ----------
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./mern_docker/backend
          file: ./mern_docker/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest
