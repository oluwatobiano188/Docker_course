name: Build and Push Docker Images

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show repo structure
        run: |
          pwd
          ls -la
          ls -la Mern_docker || true

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Mern_docker/frontend
          file: ./Mern_docker/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/Mern-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Mern_docker/backend
          file: ./Mern_docker/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/Mern-backend:latest


